name: Manual Release Asset Attach

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to attach media_server_vX_X_X.bin to (example: v0.1.3)
        required: true
        type: string

permissions:
  contents: write

jobs:
  attach-firmware:
    runs-on: ubuntu-latest
    env:
      PIO_ENV: esp32-s3-devkitc-1-n32r16v
      EXPECTED_BOARD: esp32-s3-devkitc-1-n32r16v
      EXPECTED_PARTITIONS: partitions/partitions_32mb.csv
      EXPECTED_FRAMEWORK: arduino
      EXPECTED_FLASH_MODE: opi
      EXPECTED_MEMORY_TYPE: opi_opi
      EXPECTED_PSRAM_TYPE: opi
    steps:
      - name: Checkout repository with tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate tag input and existing tag/release
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if [[ -z "$tag" ]]; then
            echo "::error::Input 'tag' is required. Example: v0.1.3"
            exit 1
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid tag format: '$tag'. Expected semantic tag like v0.1.3"
            exit 1
          fi
          git fetch --tags --force origin
          if ! git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
            echo "::error::Tag '${tag}' does not exist in this repository."
            exit 1
          fi
          if ! command -v gh >/dev/null 2>&1; then
            echo "::error::GitHub CLI (gh) is not installed on runner."
            exit 1
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::GitHub release for tag '${tag}' does not exist. Create the release first."
            exit 1
          fi
          asset_name="media_server_${tag//./_}.bin"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${asset_name}" >> "$GITHUB_OUTPUT"

      - name: Checkout requested tag
        run: |
          set -euo pipefail
          git checkout "refs/tags/${{ steps.target.outputs.tag }}"

      - name: Build firmware for esp32-s3-devkitc-1-n32r16v
        run: |
          set -euo pipefail
          tag="${{ steps.target.outputs.tag }}"
          if [[ -f src/firmware_version.h ]]; then
            cat > src/firmware_version.h <<EOF
            #pragma once

            namespace firmware {
            inline constexpr const char* kFirmwareVersion = "${tag}";
            }  // namespace firmware
            EOF
            if ! grep -Fq "kFirmwareVersion = \"${tag}\";" src/firmware_version.h; then
              echo "::error::Failed to stamp firmware UI version ${tag} into src/firmware_version.h"
              exit 1
            fi
          else
            echo "INFO: src/firmware_version.h not present in this tag; skipping UI version stamp."
          fi
          bash scripts/verify_release_build_parity.sh \
            "$PIO_ENV" \
            "$EXPECTED_BOARD" \
            "$EXPECTED_PARTITIONS" \
            "$EXPECTED_FRAMEWORK" \
            "$EXPECTED_FLASH_MODE" \
            "$EXPECTED_MEMORY_TYPE" \
            "$EXPECTED_PSRAM_TYPE"
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet platformio
          pio run -e "$PIO_ENV"

      - name: Validate firmware artifact
        id: firmware
        run: |
          set -euo pipefail
          expected_path=".pio/build/${PIO_ENV}/firmware.bin"
          mapfile -t firmware_bins < <(find .pio/build -type f -name firmware.bin | sort)
          if (( ${#firmware_bins[@]} == 0 )); then
            echo "::error::No firmware.bin artifact found under .pio/build after build."
            exit 1
          fi
          if (( ${#firmware_bins[@]} > 1 )); then
            echo "::error::Ambiguous firmware artifacts detected. Expected exactly one firmware.bin, found ${#firmware_bins[@]}:"
            printf ' - %s\n' "${firmware_bins[@]}"
            exit 1
          fi
          if [[ "${firmware_bins[0]}" != "${expected_path}" ]]; then
            echo "::error::Firmware binary path mismatch. Expected ${expected_path}, found ${firmware_bins[0]}"
            exit 1
          fi
          if [[ ! -s "${expected_path}" ]]; then
            echo "::error::Firmware artifact exists but is empty: ${expected_path}"
            exit 1
          fi
          echo "path=${expected_path}" >> "$GITHUB_OUTPUT"

      - name: Upload firmware asset to existing release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          tag="${{ steps.target.outputs.tag }}"
          firmware_path="${{ steps.firmware.outputs.path }}"
          asset_name="${{ steps.target.outputs.asset_name }}"
          if [[ -z "$tag" ]]; then
            echo "::error::Upload target tag is empty."
            exit 1
          fi
          if [[ ! -f "$firmware_path" ]]; then
            echo "::error::Upload asset does not exist: $firmware_path"
            exit 1
          fi
          if ! gh release upload "$tag" "${firmware_path}#${asset_name}" --clobber; then
            echo "::error::Failed to upload ${asset_name} to release '${tag}'."
            exit 1
          fi
          
