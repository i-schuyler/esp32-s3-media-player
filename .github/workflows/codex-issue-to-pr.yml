name: Codex Issue to PR

on:
  issues:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  workflow_dispatch:

concurrency:
  group: issue-${{ github.event.issue.number || github.event.issue.pull_request.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  draft-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure git identity for Codex commits
        run: |
          git config --global user.name "OpenAI Codex"
          git config --global user.email "codex@users.noreply.github.com"

      - name: Comment 'Codex started…' on issue
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            if (context.eventName === 'issue_comment') {
              const body = ((context.payload.comment && context.payload.comment.body) || '').trim();
              if (body !== '/retry') {
                core.info(`Ignoring issue_comment body: ${body}`);
                return;
              }
            }

            if (!context.payload.issue) {
              core.info('No issue payload found for this event; skipping started comment.');
              return;
            }

            const issueNumber = context.payload.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: 'Codex started…',
            });

      - name: Codex draft PR from issue
        id: codex_run
        if: |
          github.event_name == 'issues' ||
          (github.event_name == 'issue_comment' && github.event.comment.body == '/retry') ||
          github.event_name == 'workflow_dispatch'
        uses: openai/codex-action@v1
        with:
          sandbox: danger-full-access
          prompt: |
            You are an automation agent for this repository.
            Read the GitHub Issue (title + body) and do the following:

            1) Convert it into an implementation plan that references ACCEPTANCE.md and docs/SMOKE_TEST_SPEC.md.
            2) Implement only the minimum necessary code/docs to satisfy the request.
               - No refactors unless required.
               - No unrelated features.
            3) Open a pull request with:
               - A full link to the Issue URL
               - A short Scope section
               - RISK: low|med|high (choose conservatively)
               - BREAKING: no unless absolutely required
               - NEEDS_HIL: no (until a HIL runner exists)
            4) Ensure the PR will pass policy-gates in CI.
            5) If you push a branch but cannot create a PR, comment the pushed branch name and commit SHA on the issue and stop.

            If you cannot safely implement without more info, comment a concise question on the Issue and stop.
          openai-api-key: ${{ secrets.OPENAI_API_KEY }}

      - name: Find created PR and comment on the issue
        if: |
          always() && (
            github.event_name == 'issues' ||
            (github.event_name == 'issue_comment' && github.event.comment.body == '/retry') ||
            github.event_name == 'workflow_dispatch'
          )
        uses: actions/github-script@v7
        env:
          CODEX_STEP_OUTCOME: ${{ steps.codex_run.outcome }}
        with:
          github-token: ${{ github.token }}
          script: |
            if (!context.payload.issue) {
              core.setFailed('No issue payload found; cannot discover or comment linked PR.');
              return;
            }

            const issueNumber = context.payload.issue.number;
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issueUrl = context.payload.issue.html_url;
            const codexOutcome = process.env.CODEX_STEP_OUTCOME || 'unknown';

            const discoveredPrs = new Map();

            async function addPullRequest(pullNumber, source) {
              if (discoveredPrs.has(pullNumber)) return;
              const { data: pr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: pullNumber,
              });
              discoveredPrs.set(pr.number, pr);
              core.info(`Found PR #${pr.number} via ${source}: ${pr.html_url}`);
            }

            async function search(query) {
              return await github.rest.search.issuesAndPullRequests({ q: query, per_page: 50 });
            }

            const searchQueries = [
              `repo:${owner}/${repo} is:pr state:all "${issueUrl}"`,
              `repo:${owner}/${repo} is:pr state:all "issues/${issueNumber}"`,
              `repo:${owner}/${repo} is:pr state:all "#${issueNumber}"`,
              `repo:${owner}/${repo} is:pr state:all "${owner}/${repo}#${issueNumber}"`,
            ];

            for (const query of searchQueries) {
              const results = await search(query);
              for (const item of results.data.items) {
                await addPullRequest(item.number, `search:${query}`);
              }
            }

            const escapedIssueNumber = String(issueNumber).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const issueBranchPatterns = [
              new RegExp(`^codex/issue-${escapedIssueNumber}(?:$|[-/].+)`),
              new RegExp(`^issue-${escapedIssueNumber}(?:$|[-/].+)`),
            ];
            const issueBranchRefPrefixes = [
              `heads/codex/issue-${issueNumber}`,
              `heads/issue-${issueNumber}`,
            ];

            function isIssueBranchForNumber(branchName) {
              return issueBranchPatterns.some((pattern) => pattern.test(branchName));
            }

            const matchingIssueRefMap = new Map();

            for (const issueBranchPrefix of issueBranchRefPrefixes) {
              try {
                const refs = await github.rest.git.listMatchingRefs({
                  owner,
                  repo,
                  ref: issueBranchPrefix,
                });

                for (const refEntry of refs.data) {
                  if (!refEntry.ref.startsWith('refs/heads/')) continue;

                  const branch = refEntry.ref.replace('refs/heads/', '');
                  if (!isIssueBranchForNumber(branch)) continue;

                  matchingIssueRefMap.set(branch, {
                    branch,
                    sha: refEntry.object.sha,
                  });
                }
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }
            }

            const matchingIssueRefs = Array.from(matchingIssueRefMap.values());

            async function getCommitUpdatedAt(sha) {
              try {
                const commitResponse = await github.rest.repos.getCommit({
                  owner,
                  repo,
                  ref: sha,
                });
                return commitResponse.data.commit?.committer?.date || commitResponse.data.commit?.author?.date || null;
              } catch (error) {
                core.warning(`Unable to resolve commit timestamp for ${sha}: ${error.message || error}`);
                return null;
              }
            }

            for (const refEntry of matchingIssueRefs) {
              refEntry.updatedAt = await getCommitUpdatedAt(refEntry.sha);

              const prsForBranch = await github.rest.pulls.list({
                owner,
                repo,
                state: 'all',
                head: `${owner}:${refEntry.branch}`,
                per_page: 20,
              });

              for (const pr of prsForBranch.data) {
                await addPullRequest(pr.number, `head:${refEntry.branch}`);
              }

              const prsForCommit = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner,
                repo,
                commit_sha: refEntry.sha,
                per_page: 20,
              });

              for (const pr of prsForCommit.data) {
                await addPullRequest(pr.number, `commit:${refEntry.sha}`);
              }
            }

            matchingIssueRefs.sort((a, b) => {
              const aUpdatedAt = a.updatedAt ? new Date(a.updatedAt).getTime() : 0;
              const bUpdatedAt = b.updatedAt ? new Date(b.updatedAt).getTime() : 0;
              return bUpdatedAt - aUpdatedAt;
            });

            const likelyRecoveryBranch = matchingIssueRefs[0] || null;

            const branchSet = new Set(matchingIssueRefs.map((refEntry) => refEntry.branch));
            const linkedPrs = Array.from(discoveredPrs.values());

            if (!linkedPrs.length) {
              const branchLines = matchingIssueRefs.length
                ? matchingIssueRefs
                    .map((refEntry) => {
                      const updatedAtNote = refEntry.updatedAt ? ` (updated ${refEntry.updatedAt})` : '';
                      return `- \`${refEntry.branch}\` @ \`${refEntry.sha}\`${updatedAtNote}`;
                    })
                    .join('\n')
                : '- none found';

              const likelyRecoveryLine = likelyRecoveryBranch
                ? `Likely recovery branch: \`${likelyRecoveryBranch.branch}\` @ \`${likelyRecoveryBranch.sha}\``
                : 'Likely recovery branch: none';

              const recoveryBody = [
                `Codex workflow ran, but no PR was discoverable for issue #${issueNumber}.`,
                '',
                `Codex step outcome: \`${codexOutcome}\``,
                '',
                'Detected issue branch tips:',
                branchLines,
                '',
                likelyRecoveryLine,
                '',
                'Manual recovery:',
                '1. If a branch exists above, open a PR from that branch into `main`.',
                `2. Ensure the PR body includes this issue URL: ${issueUrl}`,
                '3. Comment `/retry` on this issue after creating/updating the PR.',
                '',
                `Workflow run: https://github.com/${owner}/${repo}/actions/runs/${process.env.GITHUB_RUN_ID}`,
              ].join('\n');

              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: issueNumber,
                body: recoveryBody,
              });
              core.setFailed(`Codex did not produce a discoverable PR for issue #${issueNumber}.`);
              return;
            }

            const pr = linkedPrs.sort((a, b) => {
              const aBranchMatch = branchSet.has(a.head.ref) ? 1 : 0;
              const bBranchMatch = branchSet.has(b.head.ref) ? 1 : 0;
              if (aBranchMatch !== bBranchMatch) return bBranchMatch - aBranchMatch;

              const aOpen = a.state === 'open' ? 1 : 0;
              const bOpen = b.state === 'open' ? 1 : 0;
              if (aOpen !== bOpen) return bOpen - aOpen;

              return new Date(b.updated_at) - new Date(a.updated_at);
            })[0];

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: issueNumber,
              body: `PR created: ${pr.html_url}`,
            });
